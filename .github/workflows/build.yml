name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - name: Setup project
        run: |
          mkdir -p src/main/resources
          mkdir -p src/main/java/com/rv/client/modules
          echo 'pluginManagement {
            repositories {
              maven { url = "https://maven.fabricmc.net/" }
              mavenCentral()
              gradlePluginPortal()
            }
          }
          rootProject.name = "RVClient"' > settings.gradle
          echo 'org.gradle.jvmargs=-Xmx2G' > gradle.properties
      - name: Write build.gradle
        run: |
          echo 'plugins { id "fabric-loom" version "1.6-SNAPSHOT"; id "java" }
          version = "0.100.0"
          group = "com.rv"
          dependencies {
            minecraft "com.mojang:minecraft:1.21.1"
            mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
            modImplementation "net.fabricmc:fabric-loader:0.16.0"
            modImplementation "net.fabricmc.fabric-api:fabric-api:0.114.0+1.21.1"
          }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; toolchain { languageVersion = JavaLanguageVersion.of(21) } }
          processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }
          jar { archiveBaseName = "fabric-api-base"; archiveVersion = "0.100.0" }' > build.gradle
      - name: Write fabric.mod.json
        run: |
          echo '{"schemaVersion":1,"id":"fabric-api-base","version":"0.100.0","name":"Fabric API Base","description":"Core Fabric API module - DO NOT REMOVE","authors":["FabricMC"],"entrypoints":{"client":["com.rv.client.RVClient"]},"depends":{"fabricloader":">=0.16.0","fabric-api":"*","minecraft":">=1.21","java":">=21"}}' > src/main/resources/fabric.mod.json
      - name: Write RVClient.java
        run: |
          echo 'package com.rv.client;' > src/main/java/com/rv/client/RVClient.java
          echo 'import net.fabricmc.api.ClientModInitializer;' >> src/main/java/com/rv/client/RVClient.java
          echo 'import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;' >> src/main/java/com/rv/client/RVClient.java
          echo 'import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;' >> src/main/java/com/rv/client/RVClient.java
          echo 'import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;' >> src/main/java/com/rv/client/RVClient.java
          echo 'import com.rv.client.modules.*;' >> src/main/java/com/rv/client/RVClient.java
          echo 'public class RVClient implements ClientModInitializer {' >> src/main/java/com/rv/client/RVClient.java
          echo 'public static CrystalAura crystalAura = new CrystalAura();' >> src/main/java/com/rv/client/RVClient.java
          echo 'public static AnchorAura anchorAura = new AnchorAura();' >> src/main/java/com/rv/client/RVClient.java
          echo 'public static AutoTotem autoTotem = new AutoTotem();' >> src/main/java/com/rv/client/RVClient.java
          echo 'public static AutoMiss autoMiss = new AutoMiss();' >> src/main/java/com/rv/client/RVClient.java
          echo '@Override public void onInitializeClient() {' >> src/main/java/com/rv/client/RVClient.java
          echo 'ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {' >> src/main/java/com/rv/client/RVClient.java
          echo 'dispatcher.register(ClientCommandManager.literal("crystal").executes(context -> { crystalAura.toggle(); return 1; }));' >> src/main/java/com/rv/client/RVClient.java
          echo 'dispatcher.register(ClientCommandManager.literal("anchor").executes(context -> { anchorAura.toggle(); return 1; }));' >> src/main/java/com/rv/client/RVClient.java
          echo 'dispatcher.register(ClientCommandManager.literal("totem").executes(context -> { autoTotem.toggle(); return 1; }));' >> src/main/java/com/rv/client/RVClient.java
          echo 'dispatcher.register(ClientCommandManager.literal("miss").executes(context -> { autoMiss.toggle(); return 1; }));' >> src/main/java/com/rv/client/RVClient.java
          echo '});' >> src/main/java/com/rv/client/RVClient.java
          echo 'ClientTickEvents.END_CLIENT_TICK.register(client -> {' >> src/main/java/com/rv/client/RVClient.java
          echo 'if (crystalAura.isEnabled()) crystalAura.onTick(client);' >> src/main/java/com/rv/client/RVClient.java
          echo 'if (anchorAura.isEnabled()) anchorAura.onTick(client);' >> src/main/java/com/rv/client/RVClient.java
          echo 'if (autoTotem.isEnabled()) autoTotem.onTick(client);' >> src/main/java/com/rv/client/RVClient.java
          echo '});' >> src/main/java/com/rv/client/RVClient.java
          echo '}' >> src/main/java/com/rv/client/RVClient.java
          echo '}' >> src/main/java/com/rv/client/RVClient.java
      - name: Write Module.java
        run: |
          echo 'package com.rv.client.modules;' > src/main/java/com/rv/client/modules/Module.java
          echo 'import net.minecraft.client.MinecraftClient;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'import net.minecraft.item.Item;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public abstract class Module {' >> src/main/java/com/rv/client/modules/Module.java
          echo 'private boolean enabled = false;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'private final String name;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public Module(String name) { this.name = name; }' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public void toggle() { enabled = !enabled; }' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public boolean isEnabled() { return enabled; }' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public String getName() { return name; }' >> src/main/java/com/rv/client/modules/Module.java
          echo 'public abstract void onTick(MinecraftClient client);' >> src/main/java/com/rv/client/modules/Module.java
          echo 'protected int findItem(MinecraftClient client, Item item) {' >> src/main/java/com/rv/client/modules/Module.java
          echo 'for (int i = 0; i < 9; i++) {' >> src/main/java/com/rv/client/modules/Module.java
          echo 'if (!client.player.getInventory().getStack(i).isEmpty() && client.player.getInventory().getStack(i).getItem() == item) return i;' >> src/main/java/com/rv/client/modules/Module.java
          echo '}' >> src/main/java/com/rv/client/modules/Module.java
          echo 'return -1;' >> src/main/java/com/rv/client/modules/Module.java
          echo '}' >> src/main/java/com/rv/client/modules/Module.java
          echo 'protected void switchSlot(MinecraftClient client, int slot) {' >> src/main/java/com/rv/client/modules/Module.java
          echo 'client.player.getInventory().selectedSlot = slot;' >> src/main/java/com/rv/client/modules/Module.java
          echo 'client.player.networkHandler.sendPacket(new UpdateSelectedSlotC2SPacket(slot));' >> src/main/java/com/rv/client/modules/Module.java
          echo '}' >> src/main/java/com/rv/client/modules/Module.java
          echo '}' >> src/main/java/com/rv/client/modules/Module.java
      - name: Write CrystalAura.java
        run: |
          echo 'package com.rv.client.modules;' > src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.client.MinecraftClient;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.entity.Entity;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.entity.LivingEntity;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.entity.decoration.EndCrystalEntity;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.entity.player.PlayerEntity;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.entity.mob.HostileEntity;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import net.minecraft.util.Hand;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import java.util.ArrayList;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'import java.util.List;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'public class CrystalAura extends Module {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'private int delay = 0;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'private final double breakRange = 6.0;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'private final double targetRange = 12.0;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'public CrystalAura() { super("Crystal"); }' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo '@Override public void onTick(MinecraftClient client) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (client.player == null || client.world == null || client.interactionManager == null) return;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (client.currentScreen != null) return;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (delay > 0) { delay--; return; }' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'List<EndCrystalEntity> crystals = new ArrayList<>();' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'List<LivingEntity> enemies = new ArrayList<>();' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'for (Entity entity : client.world.getEntities()) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (entity instanceof EndCrystalEntity) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (entity.squaredDistanceTo(client.player) <= breakRange * breakRange) crystals.add((EndCrystalEntity) entity);' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo '} else if (entity instanceof LivingEntity && entity != client.player && ((LivingEntity) entity).isAlive()) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if ((entity instanceof PlayerEntity || entity instanceof HostileEntity) && entity.squaredDistanceTo(client.player) <= targetRange * targetRange) enemies.add((LivingEntity) entity);' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo '}}' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (crystals.isEmpty() || enemies.isEmpty()) return;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'for (EndCrystalEntity crystal : crystals) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'for (LivingEntity enemy : enemies) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (crystal.squaredDistanceTo(enemy) < 12.0) {' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'if (com.rv.client.RVClient.autoMiss.isEnabled() && com.rv.client.RVClient.autoMiss.shouldMiss()) { delay = 1; return; }' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'client.interactionManager.attackEntity(client.player, crystal);' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'client.player.swingHand(Hand.MAIN_HAND);' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo 'delay = 1; return;' >> src/main/java/com/rv/client/modules/CrystalAura.java
          echo '}}}}}' >> src/main/java/com/rv/client/modules/CrystalAura.java
      - name: Write AnchorAura.java
        run: |
          echo 'package com.rv.client.modules;' > src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.client.MinecraftClient;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.entity.Entity;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.entity.LivingEntity;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.entity.player.PlayerEntity;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.entity.mob.HostileEntity;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.block.Blocks;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.block.BlockState;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.item.Items;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.util.math.BlockPos;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.util.math.Direction;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.util.math.Vec3d;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.util.Hand;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.util.hit.BlockHitResult;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'import net.minecraft.world.World;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'public class AnchorAura extends Module {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'private int delay = 0; private int phase = 0; private BlockPos anchorPos = null;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'private final double placeRange = 5.0; private final double targetRange = 8.0;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'public AnchorAura() { super("Anchor"); }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '@Override public void onTick(MinecraftClient client) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (client.player == null || client.world == null || client.interactionManager == null) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (client.currentScreen != null) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (delay > 0) { delay--; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (client.world.getRegistryKey() == World.NETHER) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'switch (phase) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'case 0: {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'LivingEntity target = findTarget(client); if (target == null) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockPos pos = findValidPos(client, target); if (pos == null) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'int anchorSlot = findItem(client, Items.RESPAWN_ANCHOR); if (anchorSlot == -1) return;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'switchSlot(client, anchorSlot);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (com.rv.client.RVClient.autoMiss.isEnabled() && com.rv.client.RVClient.autoMiss.shouldMiss()) { delay = 2; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'Vec3d hitVec = new Vec3d(pos.down().getX() + 0.5, pos.down().getY() + 1.0, pos.down().getZ() + 0.5);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockHitResult hit = new BlockHitResult(hitVec, Direction.UP, pos.down(), false);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.interactionManager.interactBlock(client.player, Hand.MAIN_HAND, hit);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.player.swingHand(Hand.MAIN_HAND); anchorPos = pos; phase = 1; delay = 1; break;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'case 1: {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (anchorPos == null) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockState bs = client.world.getBlockState(anchorPos); if (bs.getBlock() != Blocks.RESPAWN_ANCHOR) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'int glowSlot = findItem(client, Items.GLOWSTONE); if (glowSlot == -1) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'switchSlot(client, glowSlot);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'Vec3d hitVec = Vec3d.ofCenter(anchorPos);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockHitResult hit = new BlockHitResult(hitVec, Direction.UP, anchorPos, false);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.interactionManager.interactBlock(client.player, Hand.MAIN_HAND, hit);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.player.swingHand(Hand.MAIN_HAND); phase = 2; delay = 2; break;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'case 2: {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'LivingEntity target = findTarget(client); if (target == null) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockPos pos = findValidPos(client, target); if (pos == null) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'int anchorSlot = findItem(client, Items.RESPAWN_ANCHOR); if (anchorSlot == -1) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'switchSlot(client, anchorSlot);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'Vec3d hitVec = new Vec3d(pos.down().getX() + 0.5, pos.down().getY() + 1.0, pos.down().getZ() + 0.5);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockHitResult hit = new BlockHitResult(hitVec, Direction.UP, pos.down(), false);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.interactionManager.interactBlock(client.player, Hand.MAIN_HAND, hit);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.player.swingHand(Hand.MAIN_HAND); anchorPos = pos; phase = 3; delay = 1; break;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'case 3: {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (anchorPos == null) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockState bs = client.world.getBlockState(anchorPos); if (bs.getBlock() != Blocks.RESPAWN_ANCHOR) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'int glowSlot = findItem(client, Items.GLOWSTONE); if (glowSlot == -1) { phase = 0; return; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'switchSlot(client, glowSlot);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'Vec3d hitVec = Vec3d.ofCenter(anchorPos);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockHitResult hit = new BlockHitResult(hitVec, Direction.UP, anchorPos, false);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.interactionManager.interactBlock(client.player, Hand.MAIN_HAND, hit);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'client.player.swingHand(Hand.MAIN_HAND); phase = 0; delay = 5; break;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}}}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'private LivingEntity findTarget(MinecraftClient client) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'LivingEntity target = null; double bestDist = targetRange * targetRange;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'for (Entity entity : client.world.getEntities()) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (entity instanceof LivingEntity && entity != client.player && ((LivingEntity) entity).isAlive()) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (entity instanceof PlayerEntity || entity instanceof HostileEntity) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'double d = entity.squaredDistanceTo(client.player); if (d < bestDist) { bestDist = d; target = (LivingEntity) entity; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}}}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'return target;}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'private BlockPos findValidPos(MinecraftClient client, LivingEntity target) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockPos targetPos = target.getBlockPos(); BlockPos best = null; double bestD = Double.MAX_VALUE;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'for (int x = -2; x <= 2; x++) for (int y = -1; y <= 1; y++) for (int z = -2; z <= 2; z++) {' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockPos pos = targetPos.add(x, y, z);' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (client.player.squaredDistanceTo(Vec3d.ofCenter(pos)) > placeRange * placeRange) continue;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'BlockState below = client.world.getBlockState(pos.down()); if (!below.isSolidBlock(client.world, pos.down())) continue;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'if (!client.world.getBlockState(pos).isAir()) continue;' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'double d = Vec3d.ofCenter(pos).squaredDistanceTo(target.getPos()); if (d < bestD) { bestD = d; best = pos; }' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo 'return best;}' >> src/main/java/com/rv/client/modules/AnchorAura.java
          echo '}' >> src/main/java/com/rv/client/modules/AnchorAura.java
      - name: Write AutoTotem.java
        run: |
          echo 'package com.rv.client.modules;' > src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'import net.minecraft.client.MinecraftClient;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'import net.minecraft.item.Items;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'import net.minecraft.item.ItemStack;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'import net.minecraft.screen.slot.SlotActionType;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'public class AutoTotem extends Module {' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'private int delay = 0;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'public AutoTotem() { super("AutoTotem"); }' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo '@Override public void onTick(MinecraftClient client) {' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'if (client.player == null || client.interactionManager == null) return;' >> src/main/java/com/rv/client/modules/AutoTotem.java
          echo 'if (client.currentScreen != null) return;' >> src/main/java/com/rv/client/modules/AutoTotem.java
